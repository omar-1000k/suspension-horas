# El siguiente bloque es un ejemplo de cómo se usa una imagen preconstruida, para este caso, la imagen "suspension-horas:1.0-amd64".
# la imagen es con una arquitectura amd64
services:
    sustension-horas-amd64:
        image: suspension-horas:1.0-amd64
        container_name: sustension-horas
        ports:
            - "8501:8501"
        restart: unless-stopped


